<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108" role="img" aria-label="Poop">
  <!--
    The Poop mark.

    A flat three-tier swirl silhouette — the poop emoji reduced to geometry: no eyes, no highlight,
    no cartoon shading. Just the stacked tapering tiers that make the shape instantly readable, drawn
    as one solid form so it survives being shrunk to a favicon or punched into a monochrome themed icon.

    Greyscale on purpose: it is the same language as the app's chrome (light-grey fill, near-black
    ground), so the icon sits in the One UI palette rather than fighting it.

    Geometry lives inside a 108 viewport with everything kept within roughly 20..88 — the adaptive
    launcher icon masks a 108dp canvas down to as little as a 66dp circle, so anything wider gets
    clipped by the launcher.
  -->
  <g fill="#E6E6EA">
    <!-- Base tier: widest, sitting flat with softened bottom corners. -->
    <path d="M27,87 A5,5 0 0 1 22,82 C22,68.5 35,60.5 54,60.5 C73,60.5 86,68.5 86,82 A5,5 0 0 1 81,87 Z"/>
    <!-- Middle tier. Overlaps the base by ~1.5 units so the union reads as one continuous form. -->
    <path d="M31.5,62 C31.5,49.5 41,42.5 54,42.5 C67,42.5 76.5,49.5 76.5,62 Z"/>
    <!-- Top tier: tapers to a soft point — the curl of the swirl, without drawing a curl. -->
    <path d="M40.5,44 C40.5,31 46,21 54,21 C62,21 67.5,31 67.5,44 Z"/>
  </g>
</svg>
